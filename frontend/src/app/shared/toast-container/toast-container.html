<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-item" role="alert">
      <span>{{ toast.message }}</span>
      <button
        type="button"
        class="toast-close"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Fechar"
      >
        ✕
      </button>
    </div>
  }
</div>
